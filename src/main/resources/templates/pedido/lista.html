
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Epicentro Gourmet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f4;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #226b45;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .contenedor {
            max-width: 1000px;
            margin: 40px auto;
        }

        h2 {
            color: #226b45;
        }

        .btn-guardar {
            background-color: #226b45;
            color: white;
        }

        .btn-guardar:hover {
            background-color: #185031;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>EPICENTRO GOURMET</h1>
</header>

<main class="container contenedor">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">Pedidos</h2>

        <a th:href="@{/}" class="btn btn-secondary">
            ← Volver al inicio
        </a>

    </div>

    <div class="alert alert-success"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- FORMULARIO PARA REGISTRAR PEDIDOS -->

    <section class="card mb-4">
    <!-- Si esEmpleado == true, muestra el formulario para registrar pedidos. -->
             th:if="${esEmpleado}">

        <div class="card-header">
            <strong>Registrar nuevo pedido</strong>
        </div>

        <div class="card-body">

            <div class="alert alert-info"
                 th:if="${#lists.isEmpty(platos)}">
                No hay platos activos disponibles.
                Primero cargá un plato en la base de datos.
            </div>

            <form method="post"
                  th:action="@{/pedidos/nuevo}"
                  th:unless="${#lists.isEmpty(platos)}">

                <div id="filas-detalle">

                    <div class="row g-2 align-items-end mb-3 fila-detalle">

                        <div class="col-md-7">

                            <label class="form-label">Plato</label>

                            <select class="form-select selector-plato"
                                    name="detalles[0].idPlato"
                                    required>

                                <option value="">
                                    Seleccioná un plato
                                </option>

                                <option th:each="plato : ${platos}"
                                        th:value="${plato.idPlato}"
                                        th:text="${plato.nombre + ' - $' + plato.precioVenta}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">Cantidad</label>

                            <input class="form-control campo-cantidad"
                                   type="number"
                                   name="detalles[0].cantidad"
                                   min="1"
                                   value="1"
                                   required>

                        </div>

                        <div class="col-md-2">

                            <button type="button"
                                    class="btn btn-outline-danger w-100 boton-quitar"
                                    onclick="quitarFila(this)">
                                Quitar
                            </button>

                        </div>

                    </div>

                </div>

                <div class="d-flex gap-2 flex-wrap">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            onclick="agregarFila()">
                        + Agregar otro plato
                    </button>

                    <button type="submit"
                            class="btn btn-guardar">
                        Guardar pedido
                    </button>

                </div>

            </form>

        </div>

    </section>

    <!-- LISTADO DE PEDIDOS -->

    <h2 class="mb-4">Listado de pedidos</h2>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(pedidos)}">
        Todavía no hay pedidos registrados.
    </div>

    <div class="card mb-4"
         th:each="pedido : ${pedidos}">

        <div class="card-header d-flex justify-content-between">

            <strong>
                Pedido N.º
                <span th:text="${pedido.idPedido}"></span>
            </strong>

            <span th:text="${pedido.fechaPedido}"></span>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead>
                    <tr>
                        <th>Plato</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="detalle : ${pedido.detalles}">

                        <td th:text="${detalle.plato.nombre}"></td>

                        <td th:text="${detalle.cantidad}"></td>

                        <td th:text="${detalle.plato.precioVenta}"></td>

                        <td th:text="${detalle.cantidad * detalle.plato.precioVenta}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <h5 class="text-end">
                Total: $
                <span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}"></span>
            </h5>

        </div>

    </div>

</main>

<script>

    function actualizarIndices() {

        var filas = document.querySelectorAll('.fila-detalle');

        for (var i = 0; i < filas.length; i++) {

            filas[i].querySelector('.selector-plato').name =
                'detalles[' + i + '].idPlato';

            filas[i].querySelector('.campo-cantidad').name =
                'detalles[' + i + '].cantidad';
        }
    }

    function agregarFila() {

        var contenedor = document.getElementById('filas-detalle');

        var fila = contenedor.querySelector('.fila-detalle').cloneNode(true);

        fila.querySelector('.selector-plato').value = '';

        fila.querySelector('.campo-cantidad').value = '1';

        contenedor.appendChild(fila);

        actualizarIndices();
    }

    function quitarFila(boton) {

        var filas = document.querySelectorAll('.fila-detalle');

        if (filas.length > 1) {

            boton.closest('.fila-detalle').remove();

            actualizarIndices();
        }
    }

</script>

</body>
</html>
