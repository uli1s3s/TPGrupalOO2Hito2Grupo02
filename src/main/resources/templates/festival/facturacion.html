<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Facturación de festivales</h1>
            <p class="text-muted mb-0">Ranking ordenado de mayor a menor facturación.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/festivales}">Volver a festivales</a>
    </div>

    <p class="text-muted">
        El total se calcula a partir de las cantidades pedidas y el precio de venta actual de cada plato.
    </p>

    <div class="alert alert-info" th:if="${#lists.isEmpty(reporte)}">
        Todavía no hay festivales registrados.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(reporte)}">
        <table class="table table-striped table-bordered bg-white">
            <thead class="thead-dark">
            <tr>
                <th>#</th>
                <th>Festival</th>
                <th class="text-right">Facturación</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fila, estado : ${reporte}">
                <td th:text="${estado.count}"></td>
                <td th:text="${fila.nombre}"></td>
                <td class="text-right"
                    th:text="'$ ' + ${#numbers.formatDecimal(fila.facturacion, 1, 'POINT', 2, 'COMMA')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
