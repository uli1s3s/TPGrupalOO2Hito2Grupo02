<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Festivales</h1>
            <p class="text-muted mb-0">Administración de festivales y sus costos.</p>
        </div>
        <div class="d-flex flex-wrap">
            <a class="btn btn-outline-primary mr-2 mb-2"
               th:href="@{/festivales/facturacion}">Ver facturación de festivales</a>
            <a class="btn btn-success mb-2" th:href="@{/festivales/nuevo}">Nuevo festival</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(festivales)}">
        Todavía no hay festivales registrados.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(festivales)}">
        <table class="table table-striped table-bordered bg-white">
            <thead class="thead-dark">
            <tr>
                <th>Festival</th>
                <th>Temporada</th>
                <th>Fecha de inicio</th>
                <th>Fecha de fin</th>
                <th>Unidades participantes</th>
                <th>Estado</th>
                <th>Costos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="festival : ${festivales}">
                <td th:text="${festival.nombre}"></td>
                <td th:text="${festival.temporada}"></td>
                <td th:text="${festival.fechaInicio}"></td>
                <td th:text="${festival.fechaFin}"></td>
                <td>
                    <span th:if="${#lists.isEmpty(festival.nombresUnidades)}">Sin unidades</span>
                    <span th:unless="${#lists.isEmpty(festival.nombresUnidades)}"
                          th:text="${#strings.listJoin(festival.nombresUnidades, ', ')}"></span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${festival.activo} ? 'badge-success' : 'badge-secondary'"
                          th:text="${festival.activo} ? 'Activo' : 'Inactivo'">
                    </span>
                </td>
                <td>
                    <ul class="mb-0 pl-3">
                        <li th:each="costo : ${festival.costos}"
                            th:text="${costo.tipoCosto.descripcion + ': $' + #numbers.formatDecimal(costo.monto, 1, 2) + ' (' + costo.tipoUnidadAplicable.descripcion + ')'}">
                        </li>
                    </ul>
                </td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary mb-1"
                       th:href="@{/festivales/{id}/editar(id=${festival.idFestival})}">Editar</a>
                    <form class="d-inline"
                          th:action="@{/festivales/{id}/eliminar(id=${festival.idFestival})}"
                          method="post"
                          onsubmit="return confirm('¿Eliminar este festival, sus costos y sus unidades participantes?');">
                        <button class="btn btn-sm btn-outline-danger mb-1" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
