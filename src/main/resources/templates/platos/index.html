<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <section class="mb-4 p-4 rounded text-white" style="background: linear-gradient(135deg, #26352b, #425843);">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2>Gestión de platos</h2>
                <p class="mb-0">Administrá los platos de tus unidades de venta.</p>
            </div>
            <a class="btn btn-warning mt-3 mt-md-0" th:href="@{/platos/nuevo}">+ Alta de plato</a>
        </div>
    </section>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead class="thead-dark">
                    <tr>
                        <th>Plato</th>
                        <th>Unidad de venta</th>
                        <th>Precio de venta</th>
                        <th>Costo de producción</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(platos)}">
                        <td colspan="6" class="text-center">Todavía no hay platos registrados.</td>
                    </tr>
                    <tr th:each="plato : ${platos}">
                        <td th:text="${plato.nombre}"></td>
                        <td th:text="${plato.nombreUnidad}"></td>
                        <td th:text="${#numbers.formatDecimal(plato.precioVenta, 1, 2)}"></td>
                        <td th:text="${#numbers.formatDecimal(plato.costoProduccion, 1, 2)}"></td>
                        <td>
                            <span th:if="${plato.activo}" class="badge badge-success">Activo</span>
                            <span th:unless="${plato.activo}" class="badge badge-secondary">Inactivo</span>
                        </td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/platos/editar/{id}(id=${plato.idPlato})}">Modificar</a>
                            <form th:if="${plato.activo}"
                                  th:action="@{/platos/{id}/baja(id=${plato.idPlato})}"
                                  method="post" class="d-inline">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
                            </form>
                            <form th:unless="${plato.activo}"
                                  th:action="@{/platos/{id}/alta(id=${plato.idPlato})}"
                                  method="post" class="d-inline">
                                <button class="btn btn-sm btn-outline-success" type="submit">Reactivar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
