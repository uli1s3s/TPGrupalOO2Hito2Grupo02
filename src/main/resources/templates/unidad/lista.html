<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
	
	<style>
	    /* La tabla del listado no se mueve al pasar el mouse */
	    .card.tabla-fija,
	    .card.tabla-fija:hover {
	        transform: none;
	        box-shadow: var(--shadow);
	        transition: none;
	    }
	</style>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Unidades de venta</h2>
    </div>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(unidades)}">
        Todavía no hay unidades de venta registradas.
    </div>

       <div class="card tabla-fija" th:unless="${#lists.isEmpty(unidades)}">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead class="thead-dark">
                <tr>
                    <th>Código</th>
                    <th>Nombre comercial</th>
                    <th>Tipo</th>
                    <th>Detalle</th>
                    <th>Superficie (m²)</th>
                    <th>Responsable</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="unidad : ${unidades}">
                    <td th:text="${unidad.codigoUnico}">FT001</td>
                    <td th:text="${unidad.nombreComercial}">Nombre</td>
                    <td th:text="${unidad.tipo}">Food truck</td>
                    <td th:text="${unidad.detalle}">Detalle</td>
                    <td th:text="${#numbers.formatDecimal(unidad.superficieM2, 1, 2)}">0.00</td>
                    <td th:text="${unidad.responsable.email}">resp@mail.com</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
