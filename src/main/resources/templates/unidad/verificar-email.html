<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<style>
    .verif-contenedor { margin-top: 30px; margin-bottom: 50px; max-width: 520px; }
    .verif-card, .verif-card:hover {
        background-color: white; border: none; border-top: 5px solid #d99a4e; border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); transform: none; transition: none;
    }
    .verif-card .card-body { padding: 32px; }
    .verif-titulo { color: #26352b; font-weight: bold; font-size: 24px; }
    .input-codigo {
        font-size: 28px; letter-spacing: 10px; text-align: center; font-weight: bold; height: 60px;
    }
    .boton-verde { background-color: #26352b; border-color: #26352b; color: white; font-weight: bold; }
    .boton-verde:hover { background-color: #425843; color: white; }
</style>

<main class="container verif-contenedor">

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card verif-card">
        <div class="card-body text-center">

            <div class="verif-titulo">Verificá tu email</div>
            <p class="text-muted mt-2">
                Ingresá el código de 6 dígitos que enviamos a
                <strong th:text="${email}">correo@mail.com</strong>.
                El código vence en 15 minutos.
            </p>

            <!-- INGRESAR CODIGO -->
            <form th:action="@{/registro-responsable/verificar}" method="post" class="mt-3">
                <input type="hidden" name="email" th:value="${email}"/>
                <input type="text" name="codigo" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                       class="form-control input-codigo" placeholder="000000" required autofocus/>
                <button type="submit" class="btn boton-verde btn-block mt-3">Verificar</button>
            </form>

            <!-- REENVIAR -->
            <form th:action="@{/registro-responsable/reenviar}" method="post" class="mt-3">
                <input type="hidden" name="email" th:value="${email}"/>
                <span class="text-muted small">¿No te llegó? Revisá Spam o</span>
                <button type="submit" class="btn btn-link btn-sm p-0 align-baseline">pedí un código nuevo</button>
            </form>

        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
