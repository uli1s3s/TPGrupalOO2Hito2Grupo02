<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="card form-card">
        <div class="card-body text-center">
            <h2 class="text-success">¡Registro exitoso!</h2>
            <p class="mt-3">
                Tu unidad de venta quedo registrada y ya sos su responsable.
            </p>
			<p th:if="${codigoGenerado}">
			    Código de tu unidad: <strong th:text="${codigoGenerado}">FT00000001</strong>
			</p>
            <p th:if="${emailRegistrado}">
                Inicia sesión con tu usuario:
                <strong th:text="${emailRegistrado}">correo@mail.com</strong>
            </p>
            <a th:href="@{/login}" class="btn btn-primary mt-2">Iniciar sesion</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
