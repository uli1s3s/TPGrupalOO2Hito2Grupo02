
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>Epicentro Gourmet</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>

    <!-- CSS original -->
    <link rel="stylesheet"
          th:href="@{/css/modern-business.css}"/>

    <style>
        body {
            background-color: #f7f5f0;
            color: #26352b;
            font-family: Arial, sans-serif;
            padding-top: 76px;
        }

        /* BARRA DE NAVEGACIÓN */

        .navbar-epicentro {
            background-color: #26352b;
            min-height: 76px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .navbar-epicentro .navbar-brand {
            color: #ffffff;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        .navbar-epicentro .navbar-brand:hover {
            color: #e2ae69;
        }

        .navbar-epicentro .nav-link {
            color: #e8ece7 !important;
            font-size: 15px;
            padding: 10px 14px !important;
            transition: color 0.2s;
        }

        .navbar-epicentro .nav-link:hover {
            color: #e2ae69 !important;
        }

        .navbar-epicentro .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ROL */

        .rol-navbar {
            background-color: rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 6px 12px;
            color: #ffffff;
            font-size: 13px;
            white-space: nowrap;
        }

        /* USUARIO */

        .usuario-navbar {
            font-weight: bold;
        }

        .navbar-epicentro .dropdown-menu {
            border: none;
            border-radius: 8px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        }

        .navbar-epicentro .dropdown-item {
            padding: 11px 20px;
            font-size: 14px;
            color: #26352b;
        }

        .navbar-epicentro .dropdown-item:hover {
            background-color: #f0f2ed;
        }

        /* BOTONES DE VISITANTES */

        .navbar-epicentro .btn-login-navbar {
            border: 1px solid #e8ece7;
            border-radius: 7px;
            padding: 8px 15px !important;
            margin: 4px;
            text-align: center;
        }

        .navbar-epicentro .btn-login-navbar:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .navbar-epicentro .btn-registro-navbar {
            background-color: #d99a4e;
            color: #26352b !important;
            border-radius: 7px;
            padding: 8px 15px !important;
            margin: 4px;
            font-weight: bold;
            text-align: center;
        }

        .navbar-epicentro .btn-registro-navbar:hover {
            background-color: #e2ae69;
            color: #26352b !important;
        }

        /* PIE DE PÁGINA */

        .footer-epicentro {
            background-color: #26352b;
            color: #e8ece7;
            padding: 28px 15px;
            margin-top: 50px;
            text-align: center;
        }

        .footer-epicentro p {
            margin-bottom: 0;
            font-size: 14px;
        }

        .footer-epicentro .marca-footer {
            color: #e2ae69;
            font-weight: bold;
        }

        @media (max-width: 991px) {

            .navbar-epicentro .navbar-nav {
                padding-top: 10px;
            }

            .rol-navbar {
                display: inline-block;
                margin: 8px 0;
            }
        }
    </style>

</head>

<body>

<!-- BARRA DE NAVEGACIÓN -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-epicentro fixed-top"
     th:fragment="navbar">

    <div class="container">

        <!-- LOGO -->

        <a class="navbar-brand"
           th:href="@{/index}">
            Epicentro Gourmet
        </a>

        <!-- MENÚ RESPONSIVE -->

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Mostrar menú">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <!-- MENÚ PRINCIPAL -->

            <ul class="navbar-nav mr-auto">

                <!-- INICIO: TODOS -->

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/index}">
                        Inicio
                    </a>
                </li>

                <!-- FESTIVALES DISPONIBLES: TODOS -->

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/index#festivales}">
                        Festivales
                    </a>
                </li>

                <!-- GESTIÓN DE FESTIVALES: ADMINISTRADOR -->

                <li class="nav-item"
                    sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link"
                       th:href="@{/festivales}">
                        Administrar festivales
                    </a>
                </li>

                <!-- PEDIDOS: USUARIOS AUTORIZADOS -->

                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE','EMPLEADO')">

                    <a class="nav-link"
                       th:href="@{/pedidos}">
                        Pedidos
                    </a>

                </li>

                <!-- PERSONAL: ADMINISTRADOR Y RESPONSABLE -->

                <li class="nav-item"
                    sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE')">

                    <a class="nav-link"
                       th:href="@{/empleados}">
                        Personal
                    </a>

                </li>

                <!-- PLATOS: RESPONSABLE -->

                <li class="nav-item"
                    sec:authorize="hasRole('RESPONSABLE')">
                    <a class="nav-link"
                       th:href="@{/platos}">
                        Platos
                    </a>
                </li>

            </ul>

            <!-- VISITANTE SIN INICIAR SESIÓN -->

            <ul class="navbar-nav align-items-lg-center"
                sec:authorize="isAnonymous()">

                <li class="nav-item">

                    <a class="nav-link btn-login-navbar"
                       th:href="@{/login}">
                        Iniciar sesión
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link btn-registro-navbar"
                       th:href="@{/unidades/nueva}">
                        Registrar unidad
                    </a>
		
                </li>
				
				<a class="nav-link btn-registro-navbar"
				   th:href="@{/registro-responsable}">
				    Registrar unidad
				</a>

            </ul>

            <!-- USUARIO AUTENTICADO -->

            <ul class="navbar-nav align-items-lg-center"
                sec:authorize="isAuthenticated()">

                <!-- ROL -->

                <li class="nav-item mr-lg-3"
                    th:if="${rol != null}">

                    <span class="rol-navbar">

                        Rol:

                        <strong th:text="${#strings.capitalize(
                            #strings.toLowerCase(
                                #strings.replace(rol, 'ROLE_', '')
                            )
                        )}">
                            Usuario
                        </strong>

                    </span>

                </li>

                <!-- MENÚ DEL USUARIO -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle usuario-navbar"
                       href="#"
                       id="usuarioDropdown"
                       role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false">

                        <span sec:authentication="name">
                            Usuario
                        </span>

                    </a>

                    <div class="dropdown-menu dropdown-menu-right"
                         aria-labelledby="usuarioDropdown">

                        <!-- CAMBIAR CONTRASEÑA -->

                        <a class="dropdown-item"
                           th:href="@{/cambiar-contrasena}">
                            Cambiar contraseña
                        </a>

                        <div class="dropdown-divider"></div>

                        <!-- CERRAR SESIÓN -->

                        <form th:action="@{/logout}"
                              method="post">

                            <button type="submit"
                                    class="dropdown-item">
                                Cerrar sesión
                            </button>

                        </form>

                    </div>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- PIE DE PÁGINA -->

<footer class="footer-epicentro"
        th:fragment="footer">

    <div class="container">

        <p>
            &copy; 2026

            <span class="marca-footer">
                Epicentro Gourmet
            </span>

            - Sistema de Gestión de Festivales
        </p>

    </div>

</footer>

<!-- SCRIPTS -->

<div th:fragment="scripts">

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</div>

</body>
</html>
